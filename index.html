<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau Glide API</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      margin: 0;
      padding: 2rem;
      background: #f5f7fb;
      color: #172554;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
      padding: 1.5rem;
      overflow-x: auto;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    .status {
      margin: 0.75rem 0 1rem;
      color: #1e3a8a;
      font-size: 0.95rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    th,
    td {
      border: 1px solid #cbd5e1;
      text-align: left;
      padding: 0.6rem;
      font-size: 0.9rem;
      vertical-align: top;
    }
    th {
      background: #dbeafe;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tr:nth-child(even) {
      background: #f8fafc;
    }
    .error {
      color: #b91c1c;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tableau HTML depuis l'API Glide</h1>
    <p class="status" id="status">Chargement des données...</p>
    <table id="resultTable" hidden>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const endpoint = "https://api.glideapp.io/api/function/queryTables";

    const payload = {
      appID: "PZ1dP47ufkN78pXueCgR",
      queries: [
        {
          tableName: "native-table-bZnCr8gfqBCIWXs6zQN0",
          utc: true,
        },
      ],
    };

    const headers = {
      Authorization: "Bearer 530611e9-84df-44ea-84bc-ce4f66202aaa",
      "Content-Type": "application/json",
    };

    const statusEl = document.getElementById("status");
    const tableEl = document.getElementById("resultTable");
    const theadEl = tableEl.querySelector("thead");
    const tbodyEl = tableEl.querySelector("tbody");

    function normalizeRows(apiResult) {
      if (Array.isArray(apiResult)) {
        return apiResult.flatMap((entry) => {
          if (Array.isArray(entry)) return entry;
          if (Array.isArray(entry.rows)) return entry.rows;
          return [];
        });
      }

      if (apiResult && Array.isArray(apiResult.rows)) {
        return apiResult.rows;
      }

      return [];
    }

    function renderTable(rows) {
      if (!rows.length) {
        statusEl.textContent = "Aucune ligne retournée par l'API.";
        return;
      }

      const columns = [...new Set(rows.flatMap((row) => Object.keys(row)))];

      theadEl.innerHTML = `<tr>${columns.map((col) => `<th>${col}</th>`).join("")}</tr>`;
      tbodyEl.innerHTML = rows
        .map((row) => {
          return `<tr>${columns
            .map((col) => {
              const value = row[col];
              return `<td>${value == null ? "" : String(value)}</td>`;
            })
            .join("")}</tr>`;
        })
        .join("");

      tableEl.hidden = false;
      statusEl.textContent = `${rows.length} ligne(s) chargée(s).`;
    }

    async function loadData() {
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers,
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          throw new Error(`Erreur HTTP ${response.status}`);
        }

        const data = await response.json();
        const rows = normalizeRows(data);
        renderTable(rows);
      } catch (error) {
        statusEl.innerHTML = `<span class="error">Impossible de charger les données : ${error.message}</span>`;
      }
    }

    loadData();
  </script>
</body>
</html>
